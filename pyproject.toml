[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sisalmacen"
version = "0.1.0"
description = "Sistema de gestión de almacén (escritorio, local)"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyinstaller>=6.0",
]

[project.scripts]
sisalmacen = "sisalmacen.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101", "UP037", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"